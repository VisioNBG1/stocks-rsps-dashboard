# fly.toml app configuration file generated for stocks-rsps-dashboard on 2025-11-20T18:32:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "stocks-rsps-dashboard"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  PYTHON_VERSION = "3.13"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 7200 --graceful-timeout 7200 --keep-alive 5 stock_dashboard_backend:app"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

