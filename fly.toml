# fly.toml app configuration file generated for stocks-rsps-dashboard on 2025-11-20T18:32:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "stocks-rsps-dashboard"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  PYTHON_VERSION = "3.13"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

