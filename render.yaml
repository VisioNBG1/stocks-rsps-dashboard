services:
  - type: web
    name: rsps-stocks-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn stock_dashboard_backend:app --bind 0.0.0.0:$PORT --workers 1 --timeout 900 --keep-alive 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
    healthCheckPath: /health
    autoDeploy: true
    plan: free
