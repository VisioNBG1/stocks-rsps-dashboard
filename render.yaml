services:
  - type: web
    name: stocks-rsps-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 600 --config gunicorn_config.py stock_dashboard_backend:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

